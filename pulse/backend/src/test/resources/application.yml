# Tests use an in-memory database so they never touch ./data/pulse-db.
spring:
  datasource:
    url: jdbc:h2:mem:pulse-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

pulse:
  # No live agent during a test's Spring context boot -- see
  # ScanStartupRunner's class docstring.
  jobs:
    startup-scan-enabled: false
