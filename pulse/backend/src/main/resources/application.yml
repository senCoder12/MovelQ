server:
  port: 8080

spring:
  application:
    name: pulse-backend
  datasource:
    url: jdbc:h2:file:./data/pulse-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

pulse:
  agent:
    base-url: http://localhost:8000
    connect-timeout: 2s
    read-timeout: 5s

logging:
  level:
    com.moveinsync.pulse: INFO
