server:
  port: 8080

spring:
  application:
    name: pulse-backend
  datasource:
    url: jdbc:h2:file:./data/pulse-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # Only consulted when pulse.dispatch.transport=smtp (spring-boot-starter-mail
  # autoconfigures a JavaMailSender from these). Blank host/user/password are
  # harmless while the transport is "logged" -- nothing here is read otherwise.
  mail:
    host: ${PULSE_SMTP_HOST:localhost}
    port: ${PULSE_SMTP_PORT:1025}
    username: ${PULSE_SMTP_USER:}
    password: ${PULSE_SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

pulse:
  agent:
    base-url: http://localhost:8000
    connect-timeout: 2s
    read-timeout: 5s
  dispatch:
    # logged | smtp -- see report/dispatch/ReportTransport. Swapping this is
    # a config change; nothing in code or in the API changes.
    transport: ${PULSE_DISPATCH_TRANSPORT:logged}
    from-address: ${PULSE_SMTP_FROM:pulse-reports@example.com}
  smtp:
    # SmtpTransport refuses to address mail to anything outside this list,
    # regardless of what the recipient roster says -- see SmtpTransport.
    allowlist-domains: example.com

logging:
  level:
    com.moveinsync.pulse: INFO
