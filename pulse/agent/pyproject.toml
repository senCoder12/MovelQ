[project]
name = "pulse-agent"
version = "0.1.0"
description = "Pulse agent: data, stats and LLM services"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "duckdb",
    "pandas",
    "numpy",
    "pyyaml",
    "pydantic",
    "python-dotenv",
    "google-genai",
    # Token ledger writes and the cost query. The agent talks to Postgres
    # directly rather than through the backend: a ledger write sits on the
    # latency path of every model call.
    "psycopg[binary,pool]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
