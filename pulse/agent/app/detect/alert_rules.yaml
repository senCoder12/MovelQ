# Alert trigger rules -- declarative on purpose, so a judge can see exactly
# what fires without reading Java or Python. Evaluated by alert_router.py
# against the ranked/deduped insight list (see its module docstring); Java
# applies cooldown and suppression on top of whatever this file matches.
#
# Fields:
#   id               unique rule id, also alert.rule_id
#   metric_id        an exact metric id, or "*" for any metric
#   condition        severity_gte | sla_breach | delta_pp_gte | new_entity |
#                    persistence_weeks_gte | reconciliation_gap_gte
#   threshold        meaning depends on condition -- see alert_router.py's
#                    per-condition evaluators for the exact semantics
#   persona          ops | strategic | shift -- who this is routed to, not
#                    which insight it's about
#   urgency          immediate | daily | weekly -- see alert_router's
#                    escalation-logic docstring for what each does
#   channel          in_app | email_digest | shift_handover
#   cooldown_hours   the same (tenant, rule_id, entity) cannot re-fire inside
#                    this window
#   min_sample       insight.metric.n below this disqualifies the rule,
#                    regardless of how the condition would otherwise read

- id: r_recon_critical
  metric_id: delay_reconciliation_gap
  condition: severity_gte
  threshold: 85
  persona: ops
  urgency: immediate
  channel: in_app
  cooldown_hours: 24
  min_sample: 1000

- id: r_safety_coverage
  metric_id: escort_coverage_night_female
  condition: delta_pp_gte
  threshold: 10
  persona: strategic
  urgency: daily
  channel: in_app
  cooldown_hours: 168
  min_sample: 500

- id: r_billing_leak
  metric_id: ev_contract_mismatch_rate
  condition: severity_gte
  threshold: 55
  persona: strategic
  urgency: weekly
  channel: email_digest
  cooldown_hours: 168
  min_sample: 500

- id: r_new_bad_entity
  metric_id: "*"
  condition: new_entity
  threshold: 0
  persona: ops
  urgency: daily
  channel: in_app
  cooldown_hours: 24
  min_sample: 0

- id: r_sla_any
  metric_id: "*"
  condition: sla_breach
  threshold: 0
  persona: ops
  urgency: immediate
  channel: in_app
  cooldown_hours: 12
  min_sample: 0
